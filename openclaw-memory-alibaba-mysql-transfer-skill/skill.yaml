# OpenClaw / ClawHub 用 skill 清单
name: openclaw-memory-alibaba-mysql-transfer-skill
version: "1.0.0"
description: 从 workspace/MEMORY.md 迁移记忆到 RDS 向量库（Agent 驱动）。当用户说「迁移本地记忆到 RDS 记忆插件」等类似表述时，读取 OpenClaw 配置目录下 workspace/MEMORY.md，逐行调用 memory_store 导入。
author: OpenClaw Memory

capabilities:
  - 读取 OpenClaw 配置目录下 workspace/MEMORY.md，逐行调用 memory_store 导入记忆到 RDS 向量库；可启动多个 subagent 并行处理，同时不超过 5 个
  - scripts/transfer.py：将 workspace/MEMORY.md 重命名为 MEMORY.md.bak.{时间戳}（导入完成后可选）

entry_points:
  - type: cli
    command: python3 scripts/transfer.py
    description: 将配置目录下 workspace/MEMORY.md 重命名为 MEMORY.md.bak.{YYYYMMDDHHMMSS}，解析失败时回退 ~/.openclaw

requires:
  bins: [python3]

os: [darwin, linux]

