# OpenClaw / ClawHub 用 skill 清单
name: openclaw-memory-alibaba-mysql-install-skill
version: "1.0.0"
description: 安装/准备 OpenClaw 阿里云 RDS 记忆插件环境。遇错勿自行重试，须用户看完日志后再决定。npm 失败后勿手动 npm 补装。每次运行 install.py/update.py 前须依赖检查。仅升级用 update.py。建议密钥写配置目录 .env；改后 gateway 重启。非交互须 --yes。
author: OpenClaw Memory

capabilities:
  - 何时用、风险（含 Skill 不可见、更新勿误跑 install.py）、环境变量；装机 install.py；仅升级 npm 插件 update.py

entry_points:
  - type: cli
    command: python3 scripts/install.py
    description: 执行前须先做依赖检查。首次装机或已配置 memory 槽位时的入口。非交互必 --yes。未检测到 slots.memory 时会创建 RDS。
  - type: cli
    command: python3 scripts/update.py
    description: 仅升级插件包、不创建 RDS；执行前须先做依赖检查（Python/npm/网络）。Skill 未加载时可用仓库绝对路径。

# 执行时建议（若平台支持）：无缓冲输出、定期轮询日志、流式转发
# runtime:
#   unbuffered: true
#   logPollInterval: 5
#   streamOutput: true

requires:
  bins: [python3]
  env:
    - ALIBABA_CLOUD_ACCESS_KEY_ID
    - ALIBABA_CLOUD_ACCESS_KEY_SECRET
    - DASHSCOPE_API_KEY
  optional_env:
    - ALIBABA_CLOUD_SECURITY_TOKEN
    - OPENCLAW_RDS_REGION
    - OPENCLAW_VPC_ID
    - OPENCLAW_VSWITCH_ID
    - OPENCLAW_ZONE_ID

os: [darwin, linux]
