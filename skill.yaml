# OpenClaw / ClawHub 用 skill 清单
name: openclaw-memory-alibaba-mysql-install-skill
version: "1.0.0"
description: 安装/准备 OpenClaw 阿里云 RDS 记忆插件环境。Skill 可能未被工作区加载；仅升级插件用 update.py。install.py 仅在 ~/.openclaw/openclaw.json 中 plugins.slots.memory 为本插件时才走更新分支，否则完整装机。建议 AK/SK/KEY 写在配置目录 .env；改后常需 gateway 重启。非交互须 --yes。
author: OpenClaw Memory

capabilities:
  - 何时用、风险（含 Skill 不可见、更新勿误跑 install.py）、环境变量；装机 install.py；仅升级 npm 插件 update.py

entry_points:
  - type: cli
    command: python3 scripts/install.py
    description: 首次装机或已配置 memory 槽位时的更新入口。非交互必 --yes。未检测到 slots.memory 时会创建 RDS。
  - type: cli
    command: python3 scripts/update.py
    description: 仅升级插件包、不创建 RDS；Skill 未加载时也可用仓库绝对路径执行。

# 执行时建议（若平台支持）：无缓冲输出、定期轮询日志、流式转发
# runtime:
#   unbuffered: true
#   logPollInterval: 5
#   streamOutput: true

requires:
  bins: [python3]
  env:
    - ALIBABA_CLOUD_ACCESS_KEY_ID
    - ALIBABA_CLOUD_ACCESS_KEY_SECRET
    - DASHSCOPE_API_KEY
  optional_env:
    - ALIBABA_CLOUD_SECURITY_TOKEN
    - OPENCLAW_RDS_REGION
    - OPENCLAW_VPC_ID
    - OPENCLAW_VSWITCH_ID
    - OPENCLAW_ZONE_ID

os: [darwin, linux]
